# 便携 CPython 的唯一来源：版本、Release 标签、四份资产的名字与校验值。
#
# 客户端不从 raw.githubusercontent.com 取它（那个域名在校园网与家宽上十次有三次
# 连不上），而是走 api.github.com 的 Release 资产接口：
#
#   curl -L -H 'Accept: application/octet-stream' \
#        https://api.github.com/repos/<repo>/releases/assets/<id>
#
# 这一跳会 302 到 CDN，实测 5 MB/s。asset id 不是稳定值（重建 Release 会变），
# 所以构建 install.sh 时由 scripts/build_installer.py 现查一次并写进脚本 ——
# 运行时零解析、一次请求。查不到时（离线构建）用这里的 asset_id 缓存。

