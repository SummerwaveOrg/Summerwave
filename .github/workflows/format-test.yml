name: Format Test

on:
  push:
    branches: [2.1.0, main, 2.2.0, 2.3, 2.4, 2.5, 3.0, 3.1, 3.2, 4.0, 4.1, 4.2, 4.3, 4.4, 4.5, 4.6, 4.6.1, 4.7]
  pull_request:
    branches: [2.1.0, main, 2.2.0, 2.3, 2.4, 2.5, 3.0, 3.1, 3.2, 4.0, 4.1, 4.2, 4.3, 4.4, 4.5, 4.6, 4.6.1, 4.7]
  workflow_dispatch:

jobs:
  format-test:
    runs-on: macos-latest
    # api.github.com 未认证只有 60 次/小时，Runner 共用出口 IP 很容易被限流；
    # pkg/pkginstaller.py 与 pkg/pkginfohelper.py 会在拿到 GH_TOKEN 时带上它。
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    strategy:
      # 3.14 与 3.15 各跑一条线；一条挂了不要取消另一条，否则看不出是哪个版本的问题
      fail-fast: false
      matrix:
        # 3.14 是环境下限（.conda 需要 compression.zstd），3.15 是上游最新正式版
        python-version: ['3.14', '3.15']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 审计需要 infosource 仓库的数据。直接检出本地副本，不走 api.github.com：
      # 未认证只有 60 次/小时，而 Runner 共用出口 IP，很容易被限流。
      - name: Checkout infosource data
        uses: actions/checkout@v7
        with:
          repository: SummerwaveOrg/SeaLane
          ref: main
          path: SeaLane-data

      - name: Setup Python
        if: matrix.python-version != '3.15'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # 3.15 这条线得自己装：actions/python-versions 里还没有 3.15.0 正式版
      # （setup-python 报 "The version '3.15' ... was not found"），runner 自带的
      # Homebrew 也还不认识 python@3.15（No available formula）。改用 uv 拉
      # python-build-standalone 的 3.15.0。
      - name: Setup Python 3.15 (uv / python-build-standalone)
        if: matrix.python-version == '3.15'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.15'

      # setup-uv 只把解释器登记给自己用，PATH 上的 python3 还是 runner 的
      # Homebrew 3.14（PEP 668，pip 直接拒绝：externally-managed-environment）。
      # 所以显式建一个带 pip 的 venv 并插到 PATH 最前，让后面的 python3 真是 3.15。
      - name: Create the Python 3.15 environment
        if: matrix.python-version == '3.15'
        run: |
          uv venv --seed --python 3.15 "$RUNNER_TEMP/py315"
          echo "$RUNNER_TEMP/py315/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/py315/bin/python3" -VV

      # 版本不匹配就直接失败，免得 3.15 这条线悄悄跑在 3.14 上还报绿
      - name: Verify the interpreter version
        run: |
          python3 -VV
          python3 -c 'import sys; v = "%d.%d" % sys.version_info[:2]; assert v == "${{ matrix.python-version }}", v'

      - name: Install Python dependencies
        run: python3 -m pip install requests packaging urllib3 rich

      # 安装根写死（config/platforminfo.py），不需要任何配置文件；脚本里的
      # 离线测试各自用 MACWAVE_TEST 造自己的根，这里只准备一份共享的组件树。
      - name: Setup component tree
        run: |
          mkdir -p /tmp/macwave-test/bin /tmp/macwave-test/downloads/tmp
          for dir in $(sed -e 's/#.*//' scripts/components.txt); do
            mkdir -p "/tmp/macwave-test/$dir"
          done

      - name: Deploy scripts
        # 组件目录取自 scripts/components.txt —— 与安装清单（build_update_commands.py）、
        # 运行时（lib/wave.py 的 sys.path）共用同一份。加一个顶层组件时三者自动跟着走。
        run: |
          for dir in $(sed -e 's/#.*//' scripts/components.txt); do
            mkdir -p "/tmp/macwave-test/$dir"
            if compgen -G "$dir/*.py" > /dev/null; then
              cp "$dir"/*.py "/tmp/macwave-test/$dir/"
            fi
            if compgen -G "$dir/*.sh" > /dev/null; then
              cp "$dir"/*.sh "/tmp/macwave-test/$dir/"
              chmod +x "/tmp/macwave-test/$dir"/*.sh
            fi
          done
          cp lib/wave.py /tmp/macwave-test/lib/wave
          chmod +x /tmp/macwave-test/lib/wave

      - name: Run config path test
        run: |
          /bin/bash scripts/configpath_test.sh

      # basedir：家目录折成 ~，--raw 保持绝对路径；-s 被拒绝。
      - name: Run basedir test
        run: |
          /bin/bash scripts/basedir_test.sh

      # 索引布局迁移：旧布局 → pkginfo/ + 瓶子标签。纯文件操作，离线。
      - name: Run index layout migration test
        run: |
          /bin/bash scripts/migrate_index_layout_test.sh

      # 镜像 versions 清单：两个架构进同一份、缺产物不进清单、幂等、清空即清空。
      - name: Run versions index test
        run: |
          /bin/bash scripts/taginfo_test.sh
          /bin/bash scripts/release_candidate_test.sh
          /bin/bash scripts/versions_index_test.sh

      # 重打后回填索引：file/sha256 换成新产物、安装形态按归档形状决定、其它字段保留。
      - name: Run apply-rebuilt-records test
        run: |
          /bin/bash scripts/apply_rebuilt_test.sh

      # 占位前缀改写：conda 的 info/has_prefix → 安装后的绝对路径（text/script/binary）。
      - name: Run prepare_bottle test
        run: |
          /bin/bash scripts/prepare_bottle_test.sh

      # 重定位判据：@loader_path 前缀对但目标不在，必须判「未就位」。
      - name: Run relocation judgement test
        run: |
          /bin/bash scripts/relocate_test.sh

      # 多包安装：逗号分隔（有无空格都行）、一个失败不拖垮其余、带值旗标不错位。
      - name: Run multi-install test
        run: |
          /bin/bash scripts/multi_install_test.sh

      # 多包卸载：逗号分隔、@版本连写、@all、-a、全角逗号被拒、询问分支与退出码。
      - name: Run multi-uninstall test
        run: |
          /bin/bash scripts/multi_uninstall_test.sh

      # 列表排版：两竖列、列优先、每行一个 🌊、行尾无空格、--raw 一行一个。
      - name: Run list format test
        run: |
          /bin/bash scripts/list_format_test.sh

      # 整树包重装：半装残留不能让 mv 卡在 Directory not empty；越界目标仍拒绝。
      - name: Run tree reinstall test
        run: |
          /bin/bash scripts/tree_reinstall_test.sh

      # 纯离线：地址怎么拼、环境变量怎么覆盖、shell 与 Python 的默认值是否一致。
      # 放在需要联网的那些之前，地址层坏了就没必要再等网络超时。
      - name: Run domain test
        run: |
          /bin/bash scripts/domains_test.sh

      # 结构：components.txt 与 wave.py / install.sh / CI 是否对得上。
      - name: Check project structure
        run: |
          /bin/bash scripts/structure_test.sh

      # 变量后面紧跟多字节字符会在非 UTF-8 locale 下变成 unbound variable。
      # 本机 locale 是 UTF-8 时完全看不出，只有 CI 会红 —— 已经踩过两次。
      - name: Lint shell scripts
        run: |
          /bin/bash scripts/shell_lint.sh

      # 传输层契约：每个请求点都带策略（AST 检查，不是 grep）。
      - name: Check transport-layer contracts
        run: |
          /bin/bash scripts/net_policy_test.sh

      # 产物里的符号链接不得跳出 base_dir（系统库位置除外）。
      - name: Check symbolic links in payloads
        run: |
          /bin/bash scripts/linksafety_test.sh

      # min_os（实验性，4.3 转正）：版本解析、安装前提醒、info 展示。
      # 字段还没在索引里普及，所以「缺失必须静默」也是断言的一部分。
      - name: Check min_os handling
        run: |
          /bin/bash scripts/minos_test.sh

      # 安装树的互斥锁：两个 wave 同时改树会把 Shore/、bin/、.depped_* 写坏。
      - name: Check install tree locking
        run: |
          /bin/bash scripts/lock_test.sh

      # wave doctor：报得准（坏树逐条报出 + 给修复命令；好树全绿）、note 不计入
      # 退出码、--raw 可 grep，以及「跑完一个字节都没改」。
      - name: Check doctor
        run: |
          /bin/bash scripts/doctor_test.sh

      # 版本比较只有一份实现（lib/versioncompare.py）。预发布排在正式版之下、
      # 两段与三段等价、社区后缀归一化 —— 这几条错在别处都看不出来。
      - name: Check version comparison
        run: |
          /bin/bash scripts/versioncompare_test.sh

      # --raw 的输出要能直接进日志：不带 🌊、不带 ANSI、进度条是井号刻度。
      # 假索引与假产物起在 localhost，离线。
      - name: Check --raw output
        run: |
          /bin/bash scripts/raw_test.sh

      # 提权判定：按写权限，不按「是不是在家目录下」。全程 --dry-run，离线。
      - name: Check install privilege decision
        run: |
          /bin/bash scripts/install_privilege_test.sh

      # --help / --print-usage 的分工与连用规则；离线，file:// 版本数据。
      - name: Check installer flags
        run: |
          /bin/bash scripts/install_flags_test.sh

      - name: Audit dependency data
        run: |
          python3 scripts/audit_deps.py data --data-dir SeaLane-data

      - name: Run format tests
        run: |
          /bin/bash scripts/format_test.sh

      - name: Run dependency chain test
        run: |
          /bin/bash scripts/deps_test.sh --infosource SeaLane-data

      # 离线：假镜像起在 localhost，只验「报错说清楚了该怎么办」
      - name: Run message test
        run: |
          /bin/bash scripts/message_test.sh

      # 离线：假索引起在 localhost，只验「有没有更新」的判断与说法
      - name: Run latest test
        run: |
          /bin/bash scripts/latest_test.sh

      # 离线：假索引起在 localhost，验 info 的四种输出格式
      - name: Run info format test
        run: |
          /bin/bash scripts/info_format_test.sh

      - name: Run unversioned link test
        run: |
          /bin/bash scripts/link_test.sh

      - name: Run upgrade test
        run: |
          /bin/bash scripts/upgrade_test.sh

      # 会真的按 configdata 仓库的 update_command 更新一遍安装目录，所以放最后
      - name: Run selfupdate test
        run: |
          /bin/bash scripts/selfupdate_test.sh

      # 升级脚本生成：清单过滤（__pycache__ / EXCLUDED / 非安装目录）、空 delta 拒绝、
      # 可执行位、报错地址打码、以及「文件下不到必须让整次更新失败」
      - name: Run update commands test
        run: |
          /bin/bash scripts/update_commands_test.sh

      # 旗标诊断层：lib/flags.py 必须与各命令真白名单一致（它只在「命令名写错」
      # 那条路径上用到，平时跑不到，走散也没人发现），外加 -s 与未知命令的行为
      - name: Run flag test
        run: |
          /bin/bash scripts/flags_test.sh

      # 包名建议：只在 404 那条路径上跑到，平时 install 一次都碰不到。
      # 退化成「什么都不建议」时，表现只是少一行提示，不会有人报 bug。
      - name: Run suggestion test
        run: |
          /bin/bash scripts/suggest_test.sh

      # 签名位：公钥目录、验签语义（好签名 / 被改 / 没签名 / 没公钥 / 没 gpg）。
      # 验签还没接进下载流程，平时这条路径根本不跑，所以语义靠这条测试钉住。
      - name: Run signature conventions test
        run: |
          /bin/bash scripts/signature_test.sh

      # 证书失败的分诊：同一句 "SSL error" 不许对应同一条建议（过期 / 自签 /
      # 链不完整 / 主机名 / 纯网络，五种下一步完全不同）。只做字符串分类，离线。
      - name: Run certificate diagnostics test
        run: |
          /bin/bash scripts/tls_test.sh

      # 依赖清单曾散在六处，改一处漏五处。这条断言它们与 pyproject.toml 一致。
      - name: Run dependency declaration test
        run: |
          /bin/bash scripts/depsync_test.sh

      # 文档互相引用的相对链接，断了没有任何机制会告诉你
      - name: Run markdown structure test
        run: |
          /bin/bash scripts/markdown_test.sh

      # 三个「被 curl 下来直接执行」的脚本各带一份共享代码块（它们没法 source
      # 同一份文件）。副本会漂移，而漂移的后果是「某一条路径上少了半句判断」——
      # 不崩溃、只在那条路径上出错。正本在 scripts/shared/，这里逐字节比对；
      # 这个测试同时验证「不一致时真的会红」。
      - name: Check shared code blocks are in sync
        run: |
          /bin/bash scripts/shared_blocks_test.sh

      # 静态检查：配置在 pyproject.toml 与 .shellcheckrc 里。
      # 只装工具、不自动修 —— CI 的职责是「报告」，改动应当由人提交。
      - name: Lint Python
        run: |
          python3 -m pip install --quiet ruff
          dirs="$(sed -e 's/#.*//' scripts/components.txt)"
          ruff check $dirs scripts

      - name: Lint shell
        run: |
          python3 -m pip install --quiet shellcheck-py
          dirs="$(sed -e 's/#.*//' scripts/components.txt)"
          shellcheck -S warning $(find $dirs -maxdepth 1 -name '*.sh') scripts/*.sh

  # 随机化端到端回归：每次抽 10~20 个包 + 随机参数/随机打断 + 固定命令覆盖。
  # 自带安装目录挑选、部署与清理，所以不需要上面那一套 sudo 配置。
  random-test:
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14', '3.15']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout infosource data
        uses: actions/checkout@v7
        with:
          repository: SummerwaveOrg/SeaLane
          ref: main
          path: SeaLane-data

      - name: Setup Python
        if: matrix.python-version != '3.15'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # 与上面的 format-test 同因：setup-python 与 runner 的 Homebrew 都拿不到
      # 3.15.0 正式版，所以交给 uv（python-build-standalone），同样要自建 venv
      # 才能让 PATH 上的 python3 变成 3.15。
      - name: Setup Python 3.15 (uv / python-build-standalone)
        if: matrix.python-version == '3.15'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.15'

      - name: Create the Python 3.15 environment
        if: matrix.python-version == '3.15'
        run: |
          uv venv --seed --python 3.15 "$RUNNER_TEMP/py315"
          echo "$RUNNER_TEMP/py315/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/py315/bin/python3" -VV

      - name: Verify the interpreter version
        run: |
          python3 -VV
          python3 -c 'import sys; v = "%d.%d" % sys.version_info[:2]; assert v == "${{ matrix.python-version }}", v'

      - name: Install Python dependencies
        run: python3 -m pip install requests packaging urllib3 rich

      # 步骤级 timeout 低于 job 级：超时是"步骤失败"，这样下面的 always() 仍会上传日志
      - name: Run randomized regression
        timeout-minutes: 165
        run: |
          python3 -u scripts/random_test.py \
            --infosource SeaLane-data \
            --time-budget 145 \
            --log-file "$RUNNER_TEMP/random-test-${{ matrix.python-version }}.log"

      - name: Upload the regression log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: random-test-${{ matrix.python-version }}-log
          path: ${{ runner.temp }}/random-test-${{ matrix.python-version }}.log
          if-no-files-found: warn
          retention-days: 14
